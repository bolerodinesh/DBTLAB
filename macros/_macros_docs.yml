macros:
  - name: cents_to_dollars
    description: A macro that converts dollars to cents and rounds
    arguments:
      - name: column_name
        type: string
        description: The name of the input
      - name: decimals
        type: integer
        description: number of decimal places
  - name: grant_select
    description: macro to set privilege
    arguments:
        - name: schema
          type: string
          description: schema we want to grant privs on, by default is our target
        - name: role
          type: string
          description: role we want to grant privs to, by default
