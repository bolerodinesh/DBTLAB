sources:
  - name: jaffle_shop
    database: raw  
    schema: jaffle_shop  
    description: Raw Data from Snowflake
    config: 
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 12
              period: day
          loaded_at_field: _etl_loaded_at
    tables:
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary key for Order Id
            data_tests:
              - unique
              - not_null
      - name: customers
        description: Raw customers data.
        columns:
          - name: id
            description: Primary key for customer Id
            data_tests:
              - unique
              - not_null
              
              

     
    
  - name: stripe
    tables:
      - name: payments